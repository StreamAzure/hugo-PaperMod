{{- /* 社交图标。mailto: 链接不加 target="_blank" —— 浏览器会为此开一个空白标签页。
       其余外链保持在新标签页打开。 */ -}}
<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    {{- $is_mail := hasPrefix (lower (trim .url " ")) "mailto:" }}
    <a href="{{ trim .url " " | safeURL }}"{{ if not $is_mail }} target="_blank" rel="noopener noreferrer me"{{ end }}
        title="{{ (.title | default .name) | title }}">
        {{ partial "svg.html" . }}
    </a>
    {{- end }}
</div>
